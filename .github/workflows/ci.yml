name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  migrate-and-test:
    # Runs on your desktop where SQL Server DMS lives.
    # One-time setup: Settings → Actions → Runners → New self-hosted runner.
    # Only secret needed: ANTHROPIC_API_KEY
    runs-on: self-hosted

    env:
      DB_SERVER: James-desktop\sqlexpress
      DB_NAME: DMS
      DB_DRIVER: ODBC Driver 17 for SQL Server
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python scripts/run_migrations.py

      - name: Seed prompt registry
        run: python scripts/seed_prompt_registry.py

      - name: Run tests
        run: python -m pytest
