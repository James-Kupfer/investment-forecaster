name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  migrate-and-test:
    # Runs on your desktop machine where the SQLite DB lives.
    # One-time setup: Settings → Actions → Runners → New self-hosted runner.
    runs-on: self-hosted

    env:
      DB_PATH: ${{ secrets.DB_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run migrations
        run: |
          for f in $(ls migrations/*.sql 2>/dev/null | sort); do
            echo "Applying $f"
            sqlite3 "$DB_PATH" < "$f"
          done

      - name: Run tests
        run: |
          # TODO: replace with your test command once the stack is chosen
          # Python:  python -m pytest
          # Node:    npm test
          echo "No tests configured yet — add your test command here"
