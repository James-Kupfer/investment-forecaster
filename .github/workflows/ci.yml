name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'claude/**']

jobs:
  test:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest --ignore=tests/test_db.py -v
